name: Deploy to Hostinger

on:
  push:
    branches: [main]
  # 在 GitHub → Actions → Deploy to Hostinger → Run workflow 手动测部署
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    # 文件多时单线程 FTP 易超时；lftp 并行 + 整 job 上限放宽
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy-only folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site-dist | Out-Null
          Copy-Item -Path index.html -Destination _site-dist\index.html -Force
          Copy-Item -Path assets -Destination _site-dist\assets -Recurse -Force
          Copy-Item -Path products -Destination _site-dist\products -Recurse -Force
          Copy-Item -Path solutions -Destination _site-dist\solutions -Recurse -Force
          Copy-Item -Path engineering -Destination _site-dist\engineering -Recurse -Force
          Copy-Item -Path downloads -Destination _site-dist\downloads -Recurse -Force
          Copy-Item -Path cases -Destination _site-dist\cases -Recurse -Force
          Copy-Item -Path about -Destination _site-dist\about -Recurse -Force
          Copy-Item -Path rfq -Destination _site-dist\rfq -Recurse -Force
          Copy-Item -Path contact -Destination _site-dist\contact -Recurse -Force
          Copy-Item -Path privacy -Destination _site-dist\privacy -Recurse -Force
          Copy-Item -Path terms -Destination _site-dist\terms -Recurse -Force
          Copy-Item -Path standards -Destination _site-dist\standards -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path ar -Destination _site-dist\ar -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path id -Destination _site-dist\id -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path th -Destination _site-dist\th -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path vi -Destination _site-dist\vi -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path sitemap*.xml -Destination _site-dist -Force -ErrorAction SilentlyContinue
          Copy-Item -Path public/sitemap.xml -Destination _site-dist/sitemap.xml -Force -ErrorAction SilentlyContinue
          Copy-Item -Path robots.txt -Destination _site-dist\robots.txt -Force -ErrorAction SilentlyContinue
          Copy-Item -Path llms.txt -Destination _site-dist\llms.txt -Force -ErrorAction SilentlyContinue
          Copy-Item -Path llms-full.txt -Destination _site-dist\llms-full.txt -Force -ErrorAction SilentlyContinue
          Copy-Item -Path 404.html -Destination _site-dist\404.html -Force -ErrorAction SilentlyContinue
          Copy-Item -Path blog -Destination _site-dist\blog -Recurse -Force -ErrorAction SilentlyContinue
          # 部署后浏览器打开 https://你的域名/.deploy-revision.txt 应对应当前 commit（核对是否传到对目录）
          $u8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) '_site-dist/.deploy-revision.txt'), "${env:GITHUB_SHA} $(Get-Date -Format 'o')", $u8)

      # Hostinger：FTP 登录目录是用户根（与 DO_NOT_UPLOAD_HERE 同级），必须用「相对」public_html，不要用 cd /public_html（会指到服务器根路径，网站文件夹不会更新）
      - name: Deploy via lftp (parallel mirror)
        id: deploy_lftp
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # 可选：Settings → Variables → FTP_REMOTE_DIR 覆盖下面默认（主域名在 public_html 时改成 public_html）
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq lftp
          printf '%s\n' "machine ${FTP_SERVER}" "login ${FTP_USERNAME}" "password ${FTP_PASSWORD}" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          if [ -n "${FTP_REMOTE_DIR:-}" ]; then
            REMOTE="${FTP_REMOTE_DIR}"
          else
            REMOTE="domains/wibergmetal.com/public_html"
          fi
          case "$REMOTE" in */) ;; *) REMOTE="${REMOTE}/" ;; esac
          echo "lftp cd target: $REMOTE (relative to FTP home unless you set an absolute-style path in FTP_REMOTE_DIR)"
          FILES="$(find "${GITHUB_WORKSPACE}/_site-dist" -type f | wc -l)"
          echo "Starting mirror at $(date -u +%Y-%m-%dT%H:%M:%SZ) — ${FILES} files"
          {
            echo 'set dns:order "inet"'
            echo 'set net:timeout 120'
            echo 'set net:max-retries 15'
            echo 'set net:reconnect-interval-base 5'
            echo 'set ftp:ssl-allow no'
            echo 'set ftp:passive-mode true'
            echo 'set cmd:fail-exit yes'
            echo 'set cmd:verbose yes'
            echo "open -p 21 ftp://${FTP_SERVER}"
            echo "lcd ${GITHUB_WORKSPACE}/_site-dist"
            echo "cd $REMOTE"
            echo 'pwd'
            # --delete：远端多出本地没有的会删（与 _site-dist 完全一致）；勿在 public_html 里留未进仓库的重要文件
            echo 'mirror -R --delete --parallel=6 -v'
            echo 'bye'
          } > /tmp/lftp-deploy.txt
          set +e
          lftp -f /tmp/lftp-deploy.txt &
          LFTP_PID=$!
          while kill -0 "$LFTP_PID" 2>/dev/null; do
            sleep 45
            if kill -0 "$LFTP_PID" 2>/dev/null; then
              echo "…mirror still running $(date -u +%H:%M:%SZ) UTC"
            fi
          done
          wait "$LFTP_PID"
          CODE=$?
          set -e
          rm -f "$HOME/.netrc" /tmp/lftp-deploy.txt
          exit "$CODE"

      # 备用：单线程 + 远端 state 增量（lftp 失败或主机限制多连接时）
      - name: Deploy with FTP (fallback)
        if: steps.deploy_lftp.outcome == 'failure'
        id: deploy_ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ vars.FTP_REMOTE_DIR != '' && vars.FTP_REMOTE_DIR || 'domains/wibergmetal.com/public_html/' }}
          local-dir: ./_site-dist/
          state-name: hostinger-ftp-state.json
          timeout: 1800000
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/wiberg-catalogs1/**
            **/.cursor/**
            **/*.log
          log-level: standard

      - name: Deploy with FTPS (last resort)
        id: deploy_ftps
        if: steps.deploy_lftp.outcome == 'failure' && steps.deploy_ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps-legacy
          port: 21
          server-dir: ${{ vars.FTP_REMOTE_DIR != '' && vars.FTP_REMOTE_DIR || 'domains/wibergmetal.com/public_html/' }}
          local-dir: ./_site-dist/
          state-name: hostinger-ftp-state.json
          timeout: 1800000
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/wiberg-catalogs1/**
            **/.cursor/**
            **/*.log
          log-level: standard

      # FTP 成功 ≠ 浏览器看到新页：可能缓存，或域名绑在别的空间。用线上 marker 与 GITHUB_SHA 比对。
      - name: Verify live site matches this commit
        if: steps.deploy_lftp.outcome == 'success' || steps.deploy_ftp.outcome == 'success' || steps.deploy_ftps.outcome == 'success'
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          set -euo pipefail
          BASE="${DEPLOY_VERIFY_URL:-https://wibergmetal.com}"
          BASE="${BASE%/}"
          echo "GET ${BASE}/.deploy-revision.txt (override with repo Variable DEPLOY_VERIFY_URL if your site uses www or another domain)"
          sleep 25
          MARK=$(curl -sfL --max-time 45 "${BASE}/.deploy-revision.txt?run=${GITHUB_RUN_ID}" || true)
          echo "Live marker (prefix): ${MARK:0:80}"
          if [ -z "$MARK" ]; then
            echo "::error::Marker file missing or not reachable. Open Hostinger → public_html: is .deploy-revision.txt there? Is GitHub FTP the same account as this panel?"
            exit 1
          fi
          case "$MARK" in "${GITHUB_SHA}"*) echo "OK: live HTML is served from this deploy (${GITHUB_SHA:0:7}). If browser still old, purge cache (Hostinger hPanel / Cloudflare)." ;; *)
            echo "::error::Marker does not match this run. Purge cache; or set DEPLOY_VERIFY_URL to the exact URL you open in browser (e.g. https://www.wibergmetal.com)."
            exit 1
          ;; esac