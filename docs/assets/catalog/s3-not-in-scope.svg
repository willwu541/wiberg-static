<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="t">
  <title id="t">Products not in catalog scope</title>
  <rect width="360" height="200" fill="#ffffff"/>
  <text x="20" y="28" font-family="Arial,sans-serif" font-size="12" fill="#1e3a5f" font-weight="700">Outside current supply scope (illustrative)</text>
  <circle cx="120" cy="110" r="35" fill="none" stroke="#9aa5b5" stroke-width="2"/>
  <g stroke="#9aa5b5" stroke-width="1"><line x1="95" y1="90" x2="145" y2="130"/><line x1="95" y1="130" x2="145" y2="90"/></g>
  <text x="75" y="165" font-family="Arial,sans-serif" font-size="9" fill="#4a5568">Expanded / perforated / mesh families</text>
  <rect x="210" y="75" width="100" height="70" fill="#eef1f5" stroke="#9aa5b5" stroke-dasharray="4 3"/>
  <text x="220" y="105" font-family="Arial,sans-serif" font-size="9" fill="#4a5568">Aluminium,</text>
  <text x="220" y="118" font-family="Arial,sans-serif" font-size="9" fill="#4a5568">riveted,</text>
  <text x="220" y="131" font-family="Arial,sans-serif" font-size="9" fill="#4a5568">swage-locked</text>
  <line x1="200" y1="50" x2="320" y2="170" stroke="#c9a227" stroke-width="3"/>
  <text x="20" y="190" font-family="Arial,sans-serif" font-size="9" fill="#4a5568">See exclusion list in text</text>
</svg>
