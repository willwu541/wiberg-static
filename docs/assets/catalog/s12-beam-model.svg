<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img" aria-labelledby="t">
  <title id="t">Simple span bearing bar model</title>
  <rect width="400" height="180" fill="#ffffff"/>
  <text x="20" y="28" font-family="Arial,sans-serif" font-size="12" fill="#1e3a5f" font-weight="700">Span in bearing-bar direction</text>
  <polygon points="60,120 340,120 340,130 60,130" fill="#d8dee8" stroke="#1a2332"/>
  <rect x="55" y="95" width="10" height="40" fill="#8a96a8" stroke="#1a2332"/><rect x="335" y="95" width="10" height="40" fill="#8a96a8" stroke="#1a2332"/>
  <line x1="60" y1="85" x2="340" y2="85" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="60" y2="90" stroke="#c9a227"/><line x1="340" y1="80" x2="340" y2="90" stroke="#c9a227"/>
  <text x="165" y="78" font-family="Arial,sans-serif" font-size="11" fill="#1a2332">Span L</text>
