<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img" aria-labelledby="t">
  <title id="t">Table assumptions checklist</title>
  <rect width="400" height="180" fill="#ffffff"/>
  <text x="20" y="28" font-family="Arial,sans-serif" font-size="12" fill="#1e3a5f" font-weight="700">Each released table states</text>
  <rect x="30" y="45" width="340" height="22" fill="#f4f6f9" stroke="#1a2332"/><text x="40" y="60" font-family="Arial,sans-serif" font-size="9" fill="#1a2332">Steel grade � design basis � support model � load type</text>
  <rect x="30" y="75" width="340" height="22" fill="#f4f6f9" stroke="#1a2332"/><text x="40" y="90" font-family="Arial,sans-serif" font-size="9" fill="#1a2332">Deflection limit � self-weight in actions? � temperature / dynamic rules</text>
  <rect x="30" y="105" width="340" height="40" fill="#fff9ec" stroke="#c9a227"/><text x="40" y="125" font-family="Arial,sans-serif" font-size="10" fill="#1a2332">If any assumption missing � do not use table</text>
  <text x="20" y="168" font-family="Arial,sans-serif" font-size="10" fill="#4a5568">Request extract or project calculation</text>
</svg>
