<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-labelledby="t">
  <title id="t">Manufacture acceptance versus EOR input</title>
  <rect width="420" height="150" fill="#ffffff"/>
  <text x="20" y="28" font-family="Arial,sans-serif" font-size="12" fill="#1e3a5f" font-weight="700">Quotation outcome (illustrative)</text>
  <rect x="30" y="50" width="150" height="45" rx="3" fill="#e8f1f8" stroke="#2b6cb0"/><text x="45" y="78" font-family="Arial,sans-serif" font-size="10" fill="#1a2332">Accepted for manufacture</text>
  <rect x="230" y="50" width="160" height="45" rx="3" fill="#fff9ec" stroke="#c9a227"/><text x="240" y="78" font-family="Arial,sans-serif" font-size="10" fill="#1a2332">Further structural input</text>
  <text x="20" y="125" font-family="Arial,sans-serif" font-size="10" fill="#4a5568">Complex layouts: drawings + load notes + deflection limits</text>
</svg>
