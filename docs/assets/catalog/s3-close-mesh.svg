<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img" aria-labelledby="t">
  <title id="t">Heavy duty and close mesh spacing</title>
  <rect width="380" height="200" fill="#ffffff"/>
  <text x="20" y="28" font-family="Arial,sans-serif" font-size="12" fill="#1e3a5f" font-weight="700">Variants  spacing / bar size (schematic)</text>
  <g stroke="#1a2332" stroke-width="3"><line x1="40" y1="100" x2="160" y2="100"/><line x1="100" y1="70" x2="100" y2="130"/></g>
  <text x="40" y="155" font-family="Arial,sans-serif" font-size="10" fill="#4a5568">Heavy-duty: larger section and/or tighter pitch</text>
  <g stroke="#2c5282" stroke-width="1"><line x1="220" y1="85" x2="220" y2="115"/><line x1="235" y1="85" x2="235" y2="115"/><line x1="250" y1="85" x2="250" y2="115"/><line x1="215" y1="92" x2="255" y2="92"/><line x1="215" y1="108" x2="255" y2="108"/></g>
  <text x="210" y="155" font-family="Arial,sans-serif" font-size="10" fill="#4a5568">Close mesh: reduced clear opening</text>
</svg>
