  <text x="45" y="82" font-family="Arial,sans-serif" font-size="10" fill="#1a2332">Drawings</text>
  <path d="M125 80 L155 80" stroke="#c9a227" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="160" y="55" width="90" height="50" rx="3" fill="#f4f6f9" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="175" y="82" font-family="Arial,sans-serif" font-size="10" fill="#1a2332">Standards</text>
