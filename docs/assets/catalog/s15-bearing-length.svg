  <rect x="40" y="120" width="300" height="25" fill="#8a96a8" stroke="#1a2332"/>
  <rect x="150" y="70" width="14" height="50" fill="#d8dee8" stroke="#1a2332"/>
  <line x1="143" y1="120" x2="171" y2="120" stroke="#c9a227" stroke-width="2"/>
  <line x1="143" y1="115" x2="143" y2="125" stroke="#c9a227"/><line x1="171" y1="115" x2="171" y2="125" stroke="#c9a227"/>
